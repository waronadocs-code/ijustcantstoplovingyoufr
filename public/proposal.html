<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>A Very Important Question 💍</title>
<style>
  /* ============================================
     EDIT YOUR NAMES + MESSAGE IN THE <script> TAG
     AT THE BOTTOM OF THIS FILE (CONFIG section)
     ============================================ */

  :root{
    --berry:#B8175C;        /* deep raspberry */
    --candy:#FF4F8B;        /* candy pink */
    --peach:#FFB86B;        /* warm peach */
    --cream:#FFF4E9;        /* soft cream */
    --ink:#3A1229;          /* plum ink */
    --mint:#7BE0C3;         /* confetti mint */
  }

  *{margin:0;padding:0;box-sizing:border-box}

  html,body{height:100%;overflow:hidden}

  body{
    font-family:'Baloo 2','Comic Sans MS',system-ui,sans-serif;
    background:linear-gradient(160deg,#FF87AE 0%,#FF4F8B 45%,#B8175C 100%);
    display:flex;align-items:center;justify-content:center;
    color:var(--cream);
    position:relative;
  }

  /* floating hearts backdrop */
  .heart-float{
    position:absolute;bottom:-8vh;
    font-size:22px;opacity:.5;
    animation:rise linear infinite;
    pointer-events:none;
    user-select:none;
  }
  @keyframes rise{
    from{transform:translateY(0) rotate(0deg)}
    to{transform:translateY(-115vh) rotate(340deg)}
  }
  @media (prefers-reduced-motion: reduce){
    .heart-float{animation:none;display:none}
  }

  .card{
    text-align:center;
    padding:2rem;
    max-width:640px;
    width:92%;
    position:relative;
    z-index:2;
  }

  .eyebrow{
    display:inline-block;
    background:rgba(255,244,233,.18);
    border:2px dashed rgba(255,244,233,.55);
    border-radius:999px;
    padding:.35rem 1.1rem;
    font-size:.95rem;
    letter-spacing:.12em;
    text-transform:uppercase;
    margin-bottom:1.2rem;
  }

  h1{
    font-size:clamp(2rem,6vw,3.6rem);
    line-height:1.12;
    text-shadow:0 4px 0 rgba(58,18,41,.25);
    margin-bottom:.6rem;
  }
  h1 .name{color:var(--peach)}

  .sub{
    font-size:clamp(1rem,2.6vw,1.25rem);
    opacity:.92;
    margin-bottom:2.4rem;
  }

  .ring{
    font-size:clamp(3.2rem,9vw,5rem);
    display:inline-block;
    animation:wobble 2.6s ease-in-out infinite;
    margin-bottom:1rem;
  }
  @keyframes wobble{
    0%,100%{transform:rotate(-8deg) translateY(0)}
    50%{transform:rotate(8deg) translateY(-8px)}
  }
  @media (prefers-reduced-motion: reduce){ .ring{animation:none} }

  .buttons{
    display:flex;
    gap:1.2rem;
    justify-content:center;
    align-items:center;
    flex-wrap:wrap;
    min-height:120px;
  }

  button{
    font-family:inherit;
    font-weight:700;
    border:none;
    border-radius:999px;
    cursor:pointer;
    transition:transform .12s ease, box-shadow .12s ease;
  }
  button:focus-visible{outline:4px solid var(--mint);outline-offset:3px}

  #yesBtn{
    background:var(--cream);
    color:var(--berry);
    font-size:1.4rem;
    padding:1rem 2.6rem;
    box-shadow:0 6px 0 rgba(58,18,41,.3);
  }
  #yesBtn:hover{transform:translateY(-3px) scale(1.04)}
  #yesBtn:active{transform:translateY(2px);box-shadow:0 2px 0 rgba(58,18,41,.3)}

  #noBtn{
    background:rgba(58,18,41,.35);
    color:var(--cream);
    font-size:1.05rem;
    padding:.8rem 1.8rem;
    box-shadow:0 4px 0 rgba(58,18,41,.35);
  }
  #noBtn.fleeing{
    position:fixed;
    z-index:5;
    transition:left .18s ease, top .18s ease;
  }

  .taunt{
    margin-top:1.4rem;
    min-height:1.6em;
    font-size:1.05rem;
    color:var(--peach);
    font-weight:700;
  }

  /* success screen */
  #success{
    display:none;
    text-align:center;
    padding:2rem;
    z-index:2;
  }
  #success h2{
    font-size:clamp(2.4rem,7vw,4.2rem);
    text-shadow:0 4px 0 rgba(58,18,41,.25);
    margin-bottom:.8rem;
  }
  #success p{
    font-size:clamp(1.05rem,2.6vw,1.3rem);
    line-height:1.55;
    opacity:.97;
    max-width:52ch;
    margin:0 auto;
  }
  .pop{animation:pop .5s cubic-bezier(.2,1.6,.4,1) both}
  @keyframes pop{from{transform:scale(.4);opacity:0}to{transform:scale(1);opacity:1}}

  canvas#confetti{
    position:fixed;inset:0;
    pointer-events:none;
    z-index:10;
  }

  /* Apple-style emoji images */
  .apple-emoji{
    display:inline-block;
    vertical-align:-0.15em;
    width:1em;height:1em;
    object-fit:contain;
  }
  .ring-img{width:clamp(3.2rem,9vw,5rem);height:auto}
  .btn-emoji{width:1.2em;height:1.2em;vertical-align:-0.25em}
  .h2-emoji{width:1em;height:1em;vertical-align:-0.12em}
  .success-emojis{margin-top:1.4rem;display:flex;gap:1rem;justify-content:center}
  .big-emoji{width:3rem;height:3rem}
</style>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&display=swap" rel="stylesheet">
</head>
<body>

<canvas id="confetti"></canvas>

<div class="card" id="question">
  <span class="ring" aria-hidden="true"><img class="apple-emoji ring-img" src="https://emojicdn.elk.sh/💍?style=apple" alt="💍"></span><br>
  <span class="eyebrow">A very important question</span>
  <h1>Hi <span class="name" id="herName"></span>, will you be my life partner?</h1>
  <p class="sub" id="subLine"></p>
  <div class="buttons">
    <button id="yesBtn">YES! <img class="apple-emoji btn-emoji" src="https://emojicdn.elk.sh/❤️?style=apple" alt="❤️"></button>
    <button id="noBtn">No</button>
  </div>
  <div class="taunt" id="taunt" aria-live="polite"></div>
</div>

<div class="card" id="success">
  <h2 class="pop">SHE SAID YES!!! <img class="apple-emoji h2-emoji" src="https://emojicdn.elk.sh/🎉?style=apple" alt="🎉"></h2>
  <p class="pop" id="successLine"></p>
  <div class="pop success-emojis">
    <img class="apple-emoji big-emoji" src="https://emojicdn.elk.sh/💍?style=apple" alt="💍">
    <img class="apple-emoji big-emoji" src="https://emojicdn.elk.sh/❤️?style=apple" alt="❤️">
    <img class="apple-emoji big-emoji" src="https://emojicdn.elk.sh/🥂?style=apple" alt="🥂">
  </div>
</div>

<script>
/* ================= CONFIG — edit these! ================= */
const CONFIG = {
  herName: "Khusela",
  subLine: "Before you answer, know this: you make every ordinary day feel like the best one yet.",
  successLine: "Since the day we met, my life has completely changed for the better. I’m tired of leaving ‘what ifs’ on the table. I want all of you — your bad days, your dreams, and your quirks. I am choosing you today, tomorrow, and every day after that, and I’m fully committed to building a beautiful future together.",
  taunts: [
    "Nice try 😏",
    "That button is broken, promise.",
    "Are you SURE about that?",
    "The universe says no to your no.",
    "You can't catch me! 😝",
    "The Yes button is getting lonely...",
    "Okay now you're just playing hard to get.",
    "Even the button knows the answer is yes. 💘"
  ]
};
/* ========================================================= */

/* Convert any emoji in a string to Apple-style emoji images */
const EMOJI_RE = /(\p{Extended_Pictographic}(?:\uFE0F|\u200D\p{Extended_Pictographic})*)/gu;
function appleize(str){
  return str.replace(EMOJI_RE, m =>
    `<img class="apple-emoji" src="https://emojicdn.elk.sh/${encodeURIComponent(m)}?style=apple" alt="${m}">`);
}

document.getElementById('herName').textContent = CONFIG.herName;
document.getElementById('subLine').textContent = CONFIG.subLine;
document.getElementById('successLine').textContent = CONFIG.successLine;

const noBtn = document.getElementById('noBtn');
const yesBtn = document.getElementById('yesBtn');
const taunt = document.getElementById('taunt');
let dodges = 0;

function flee(){
  dodges++;
  noBtn.classList.add('fleeing');
  const pad = 20;
  const bw = noBtn.offsetWidth, bh = noBtn.offsetHeight;
  const x = pad + Math.random() * (window.innerWidth - bw - pad*2);
  const y = pad + Math.random() * (window.innerHeight - bh - pad*2);
  noBtn.style.left = x + 'px';
  noBtn.style.top = y + 'px';

  taunt.innerHTML = appleize(CONFIG.taunts[Math.min(dodges-1, CONFIG.taunts.length-1)]);

  // Yes grows, No shrinks — resistance is futile
  const grow = Math.min(1 + dodges * 0.12, 2.1);
  yesBtn.style.transform = `scale(${grow})`;
  const shrink = Math.max(1 - dodges * 0.07, 0.55);
  noBtn.style.scale = shrink;
  if (dodges >= 10) { noBtn.innerHTML = appleize("fine, YES 💗"); noBtn.onclick = celebrate; }
}

noBtn.addEventListener('mouseenter', flee);
noBtn.addEventListener('touchstart', (e)=>{ e.preventDefault(); flee(); }, {passive:false});
noBtn.addEventListener('click', (e)=>{ if(dodges < 10){ e.preventDefault(); flee(); } });

/* ---------- confetti ---------- */
const canvas = document.getElementById('confetti');
const ctx = canvas.getContext('2d');
let pieces = [], raf;
function resize(){ canvas.width = innerWidth; canvas.height = innerHeight; }
addEventListener('resize', resize); resize();

const COLORS = ['#FFF4E9','#FFB86B','#7BE0C3','#FF4F8B','#FFD166','#B8175C'];
function spawnConfetti(n){
  for(let i=0;i<n;i++){
    pieces.push({
      x: Math.random()*canvas.width,
      y: -20 - Math.random()*canvas.height*0.5,
      w: 6+Math.random()*8, h: 8+Math.random()*10,
      vy: 2+Math.random()*3.5, vx: -1.5+Math.random()*3,
      rot: Math.random()*Math.PI, vr: -0.1+Math.random()*0.2,
      color: COLORS[Math.floor(Math.random()*COLORS.length)],
      heart: Math.random() < 0.18
    });
  }
}
function draw(){
  ctx.clearRect(0,0,canvas.width,canvas.height);
  pieces.forEach(p=>{
    p.x+=p.vx; p.y+=p.vy; p.rot+=p.vr;
    ctx.save(); ctx.translate(p.x,p.y); ctx.rotate(p.rot);
    if(p.heart && appleHeart.complete && appleHeart.naturalWidth){
      ctx.drawImage(appleHeart, -9, -9, 18, 18);
    } else {
      ctx.fillStyle=p.color; ctx.fillRect(-p.w/2,-p.h/2,p.w,p.h);
    }
    ctx.restore();
  });
  pieces = pieces.filter(p=>p.y < canvas.height+30);
  raf = pieces.length ? requestAnimationFrame(draw) : null;
}

function celebrate(){
  document.getElementById('question').style.display='none';
  noBtn.style.display='none';
  document.getElementById('success').style.display='block';
  spawnConfetti(260);
  if(!raf) draw();
  setTimeout(()=>{ spawnConfetti(160); if(!raf) draw(); }, 900);
  setTimeout(()=>{ spawnConfetti(160); if(!raf) draw(); }, 1900);
}
yesBtn.addEventListener('click', celebrate);

/* preloaded Apple heart for canvas confetti */
const appleHeart = new Image();
appleHeart.crossOrigin = 'anonymous';
appleHeart.src = 'https://emojicdn.elk.sh/%E2%9D%A4%EF%B8%8F?style=apple';

/* ---------- floating hearts backdrop (Apple-style images) ---------- */
const HEARTS = ['💗','💖','💕','🩷','❤️'];
for(let i=0;i<16;i++){
  const s = document.createElement('span');
  s.className='heart-float';
  const size = 14 + Math.random()*26;
  s.innerHTML = `<img class="apple-emoji" style="width:${size}px;height:${size}px" src="https://emojicdn.elk.sh/${encodeURIComponent(HEARTS[i % HEARTS.length])}?style=apple" alt="">`;
  s.style.left = Math.random()*100 + 'vw';
  s.style.animationDuration = (9 + Math.random()*12) + 's';
  s.style.animationDelay = (-Math.random()*12) + 's';
  document.body.appendChild(s);
}
</script>
</body>
</html>
